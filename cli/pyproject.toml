[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devex-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
devex = "devex_cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devex_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
