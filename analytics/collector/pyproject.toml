[project]
name = "devex-collector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "mangum>=0.17.0",
  "boto3>=1.35.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "devex-schema",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov",
  "httpx>=0.27.0",
  "moto[dynamodb]>=5.0",
  "boto3-stubs[dynamodb]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.uv.sources]
devex-schema = { path = "../schema/python" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../schema/python"]
