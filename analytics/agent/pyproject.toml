[project]
name = "devex-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "boto3>=1.35.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "devex-schema",
  "devex-warehouse",
]

[tool.uv.sources]
devex-schema = { path = "../schema/python" }
devex-warehouse = { path = "../warehouse" }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov",
  "moto[dynamodb]>=5.0",
  "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../schema/python", "../warehouse/src"]
